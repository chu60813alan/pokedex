<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>寶可夢 18 屬性全方位防禦計算機</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #FFF9F2;
      color: #333;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      width: 100%;
      max-width: 600px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 1.3rem;
      color: #D35400;
      text-align: center;
      width: 100%;
    }
    .tool-box {
      background: #FFFFFF;
      border: 2px solid #F39C12;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 12px rgba(230, 120, 23, 0.1);
    }
    .tool-box h3 {
      font-size: 1.1rem;
      color: #D35400;
      margin-bottom: 14px;
    }
    .form-group {
      margin-bottom: 14px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
      color: #555;
    }
    select, button {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #F39C12;
      font-size: 1rem;
      background-color: #FFF;
    }
    button {
      background-color: #E67E22;
      color: white;
      font-weight: bold;
      cursor: pointer;
      margin-top: 6px;
    }
    button:active { background-color: #D35400; }
    #calc-result {
      margin-top: 16px;
      padding: 16px;
      border-radius: 8px;
      background: #FFF3E6;
      font-size: 1rem;
      line-height: 1.6;
    }
    .main-result {
      font-size: 1.15rem;
      font-weight: bold;
      text-align: center;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px dashed #F39C12;
    }
    .breakdown-item {
      font-size: 0.95rem;
      color: #444;
      margin: 6px 0;
      padding-left: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>寶可夢 18 屬性防禦計算機</h1>
    </div>

    <div class="tool-box">
      <h3>⚔️ 完整屬性相剋模擬器</h3>
      
      <div class="form-group">
        <label>攻擊方的招式屬性：</label>
        <select id="atk-type">
          <option value="normal">一般</option>
          <option value="fire">火</option>
          <option value="water">水</option>
          <option value="electric">電</option>
          <option value="grass">草</option>
          <option value="ice">冰</option>
          <option value="fighting">格鬥</option>
          <option value="poison">毒</option>
          <option value="ground">地面</option>
          <option value="flying">飛行</option>
          <option value="psychic">超能力</option>
          <option value="bug">蟲</option>
          <option value="rock">岩石</option>
          <option value="ghost">幽靈</option>
          <option value="dragon">龍</option>
          <option value="dark">惡</option>
          <option value="steel">鋼</option>
          <option value="fairy">妖精</option>
        </select>
      </div>

      <div class="form-group">
        <label>防禦方寶可夢 - 第一屬性：</label>
        <select id="def-type-1">
          <option value="normal">一般</option>
          <option value="fire">火</option>
          <option value="water">水</option>
          <option value="electric">電</option>
          <option value="grass">草</option>
          <option value="ice">冰</option>
          <option value="fighting">格鬥</option>
          <option value="poison">毒</option>
          <option value="ground">地面</option>
          <option value="flying">飛行</option>
          <option value="psychic">超能力</option>
          <option value="bug">蟲</option>
          <option value="rock">岩石</option>
          <option value="ghost">幽靈</option>
          <option value="dragon">龍</option>
          <option value="dark">惡</option>
          <option value="steel">鋼</option>
          <option value="fairy">妖精</option>
        </select>
      </div>

      <div class="form-group">
        <label>防禦方寶可夢 - 第二屬性：</label>
        <select id="def-type-2">
          <option value="none">無 (單屬性)</option>
          <option value="normal">一般</option>
          <option value="fire">火</option>
          <option value="water">水</option>
          <option value="electric">電</option>
          <option value="grass">草</option>
          <option value="ice">冰</option>
          <option value="fighting">格鬥</option>
          <option value="poison">毒</option>
          <option value="ground">地面</option>
          <option value="flying">飛行</option>
          <option value="psychic">超能力</option>
          <option value="bug">蟲</option>
          <option value="rock">岩石</option>
          <option value="ghost">幽靈</option>
          <option value="dragon">龍</option>
          <option value="dark">惡</option>
          <option value="steel">鋼</option>
          <option value="fairy">妖精</option>
        </select>
      </div>

      <button onclick="calculateFullEffectiveness()">計算 18 屬性防禦倍率</button>
      
      <div id="calc-result" style="color: #666;">請選擇屬性並點擊計算</div>
    </div>
  </div>

  <script>
    const typeNames = {
      normal: "一般", fire: "火", water: "水", electric: "電",
      grass: "草", ice: "冰", fighting: "格鬥", poison: "毒",
      ground: "地面", flying: "飛行", psychic: "超能力", bug: "蟲",
      rock: "岩石", ghost: "幽靈", dragon: "龍", dark: "惡",
      steel: "鋼", fairy: "妖精"
    };

    const chart = {
      normal: { rock: 0.5, steel: 0.5, ghost: 0 },
      fire: { grass: 2, ice: 2, bug: 2, steel: 2, fire: 0.5, water: 0.5, rock: 0.5, dragon: 0.5 },
      water: { fire: 2, ground: 2, rock: 2, water: 0.5, grass: 0.5, dragon: 0.5 },
      electric: { water: 2, flying: 2, electric: 0.5, grass: 0.5, dragon: 0.5, ground: 0 },
      grass: { water: 2, ground: 2, rock: 2, fire: 0.5, grass: 0.5, poison: 0.5, flying: 0.5, bug: 0.5, dragon: 0.5, steel: 0.5 },
      ice: { grass: 2, ground: 2, flying: 2, dragon: 2, fire: 0.5, water: 0.5, ice: 0.5, steel: 0.5 },
      fighting: { normal: 2, ice: 2, rock: 2, dark: 2, steel: 2, poison: 0.5, flying: 0.5, psychic: 0.5, bug: 0.5, fairy: 0.5, ghost: 0 },
      poison: { grass: 2, fairy: 2, poison: 0.5, ground: 0.5, rock: 0.5, ghost: 0.5, steel: 0 },
      ground: { fire: 2, electric: 2, poison: 2, rock: 2, steel: 2, grass: 0.5, bug: 0.5, flying: 0 },
      flying: { grass: 2, fighting: 2, bug: 2, electric: 0.5, rock: 0.5, steel: 0.5 },
      psychic: { fighting: 2, poison: 2, psychic: 0.5, steel: 0.5, dark: 0 },
      bug: { grass: 2, psychic: 2, dark: 2, fire: 0.5, fighting: 0.5, poison: 0.5, flying: 0.5, ghost: 0.5, steel: 0.5, fairy: 0.5 },
      rock: { fire: 2, ice: 2, flying: 2, bug: 2, fighting: 0.5, ground: 0.5, steel: 0.5 },
      ghost: { psychic: 2, ghost: 2, dark: 0.5, normal: 0 },
      dragon: { dragon: 2, steel: 0.5, fairy: 0 },
      dark: { psychic: 2, ghost: 2, fighting: 0.5, dark: 0.5, fairy: 0.5 },
      steel: { ice: 2, rock: 2, fairy: 2, fire: 0.5, water: 0.5, electric: 0.5, steel: 0.5 },
      fairy: { fighting: 2, dragon: 2, dark: 2, fire: 0.5, poison: 0.5, steel: 0.5 }
    };

    function getMultiplier(atk, def) {
      if (!chart[atk]) return 1;
      return chart[atk][def] !== undefined ? chart[atk][def] : 1;
    }

    function calculateFullEffectiveness() {
      const atk = document.getElementById('atk-type').value;
      const def1 = document.getElementById('def-type-1').value;
      const def2 = document.getElementById('def-type-2').value;
      const resBox = document.getElementById('calc-result');

      let m1 = getMultiplier(atk, def1);
      let text1 = `${typeNames[atk]} 攻擊 ${typeNames[def1]}：${m1} 倍`;

      let text2 = "";
      let m2 = 1;
      if (def2 !== 'none') {
        m2 = getMultiplier(atk, def2);
        text2 = `${typeNames[atk]} 攻擊 ${typeNames[def2]}：${m2} 倍`;
      }

      let finalMultiplier = m1 * m2;

      let mainDesc = "";
      let mainColor = "#333";

      if (finalMultiplier >= 2) {
        mainColor = "#C0392B";
        mainDesc = `💥 最終傷害：<strong>${finalMultiplier} 倍 (效果絕佳)</strong>`;
      } else if (finalMultiplier === 0) {
        mainColor = "#7F8C8D";
        mainDesc = `🚫 最終傷害：<strong>0 倍 (完全無效)</strong>`;
      } else if (finalMultiplier < 1) {
        mainColor = "#D35400";
        mainDesc = `⚠️ 最終傷害：<strong>${finalMultiplier} 倍 (效果不好)</strong>`;
      } else {
        mainColor = "#27AE60";
        mainDesc = `🛡️ 最終傷害：<strong>1.0 倍 (普通)</strong>`;
      }

      let html = `<div class="main-result" style="color: ${mainColor};">${mainDesc}</div>`;
      html += `<div class="breakdown-item">▪ ${text1}</div>`;
      if (def2 !== 'none') {
        html += `<div class="breakdown-item">▪ ${text2}</div>`;
      }

      resBox.style.color = "#333";
      resBox.innerHTML = html;
    }
  </script>
</body>
</html>
