<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>寶可夢 18 屬性全方位對戰戰術中心</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #FFF9F2;
      color: #333;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      width: 100%;
      max-width: 650px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 1.2rem;
      color: #D35400;
      text-align: center;
      width: 100%;
    }
    /* 多分頁導覽列 (調整成3個分頁) */
    .tab-nav {
      display: flex;
      gap: 4px;
      margin-bottom: 16px;
    }
    .tab-btn {
      flex: 1;
      padding: 8px 4px;
      border: 2px solid #F39C12;
      background-color: #FFF3E6;
      color: #D35400;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      font-size: 0.85rem;
      transition: 0.2s;
    }
    .tab-btn.active {
      background-color: #E67E22;
      color: white;
    }
    .tool-box {
      background: #FFFFFF;
      border: 2px solid #F39C12;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 4px 12px rgba(230, 120, 23, 0.1);
    }
    .tool-box h3 {
      font-size: 1.05rem;
      color: #D35400;
      margin-bottom: 12px;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 4px;
      color: #555;
      font-size: 0.95rem;
    }
    select {
      width: 100%;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #F39C12;
      font-size: 1rem;
      background-color: #FFF;
    }
    button {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: none;
      background-color: #E67E22;
      color: white;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
      margin-top: 6px;
    }
    button:active { background-color: #D35400; }
    .panel { display: none; }
    .panel.active { display: block; }
    
    .preset-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 12px;
      max-height: 150px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .preset-btn {
      padding: 6px 4px;
      font-size: 0.8rem;
      background-color: #FFF3E6;
      border: 1px solid #F39C12;
      color: #D35400;
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
      font-weight: bold;
    }
    .preset-btn:hover { background-color: #F39C12; color: white; }

    .result-section {
      margin-top: 14px;
      padding: 14px;
      border-radius: 8px;
      background: #FFF3E6;
      font-size: 0.9rem;
      line-height: 1.5;
    }
    .result-category {
      margin-bottom: 8px;
    }
    .result-category strong {
      display: block;
      margin-bottom: 3px;
      color: #D35400;
      border-bottom: 1px dashed #F39C12;
      padding-bottom: 2px;
    }
    .type-badge {
      display: inline-block;
      padding: 3px 6px;
      margin: 2px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: bold;
      color: white;
    }
    
    /* 隊伍分析區塊樣式 */
    .team-slot {
      background: #FFF9F2;
      border: 1px dashed #F39C12;
      padding: 8px;
      border-radius: 8px;
      margin-bottom: 8px;
      display: flex;
      gap: 8px;
    }
    .team-slot select { font-size: 0.9rem; padding: 4px; }

    /* 屬性色彩標章 */
    .bg-normal { background-color: #A8A878; }
    .bg-fire { background-color: #F08030; }
    .bg-water { background-color: #6890F0; }
    .bg-electric { background-color: #F8D030; color: #333; }
    .bg-grass { background-color: #78C850; }
    .bg-ice { background-color: #98D8D8; color: #333; }
    .bg-fighting { background-color: #C03028; }
    .bg-poison { background-color: #A040A0; }
    .bg-ground { background-color: #E0C068; color: #333; }
    .bg-flying { background-color: #A890F0; }
    .bg-psychic { background-color: #F85888; }
    .bg-bug { background-color: #A8B820; }
    .bg-rock { background-color: #B8A038; }
    .bg-ghost { background-color: #705898; }
    .bg-dragon { background-color: #7038F8; }
    .bg-dark { background-color: #705848; }
    .bg-steel { background-color: #B8B8D0; color: #333; }
    .bg-fairy { background-color: #EE99AC; color: #333; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>寶可夢 18 屬性對戰戰術中心</h1>
    </div>

    <!-- 三大功能分頁切換按鈕 -->
    <div class="tab-nav">
      <div class="tab-btn active" onclick="switchTab('defense')">🛡️ 單隻攻防</div>
      <div class="tab-btn" onclick="switchTab('team')">👥 隊伍盲點</div>
      <div class="tab-btn" onclick="switchTab('ability')">✨ 特性影響</div>
    </div>

    <div class="tool-box">
      
      <!-- 分頁一：🛡️ 單隻攻防分析 (含 25 隻捷徑) -->
      <div id="panel-defense" class="panel active">
        <h3>單隻寶可夢防禦與進攻分析</h3>
        <label>🔥 快速載入 25 隻熱門寶可夢：</label>
        <div class="preset-grid">
          <button class="preset-btn" onclick="loadPreset('fire', 'flying')">M-噴火龍Y</button>
          <button class="preset-btn" onclick="loadPreset('dragon', 'ground')">烈咬陸鯊</button>
          <button class="preset-btn" onclick="loadPreset('ghost', 'fairy')">謎擬Ｑ</button>
          <button class="preset-btn" onclick="loadPreset('dragon', 'flying')">快龍</button>
          <button class="preset-btn" onclick="loadPreset('water', 'ground')">M-巨沼怪</button>
          <button class="preset-btn" onclick="loadPreset('grass', 'dark')">魔幻假面喵</button>
          <button class="preset-btn" onclick="loadPreset('fighting', 'flying')">M-姆克鷹</button>
          <button class="preset-btn" onclick="loadPreset('steel', 'psychic')">巨金怪</button>
          <button class="preset-btn" onclick="loadPreset('ghost', 'poison')">耿鬼</button>
          <button class="preset-btn" onclick="loadPreset('rock', 'dark')">班基拉斯</button>
          <button class="preset-btn" onclick="loadPreset('steel', 'flying')">鋼鎧鴨</button>
          <button class="preset-btn" onclick="loadPreset('steel', 'ghost')">賽富豪</button>
          <button class="preset-btn" onclick="loadPreset('dragon', 'steel')">鋁鋼橋龍</button>
          <button class="preset-btn" onclick="loadPreset('dark', 'steel')">劈斬將軍</button>
          <button class="preset-btn" onclick="loadPreset('fire', 'ghost')">蒼炎刃鬼</button>
          <button class="preset-btn" onclick="loadPreset('water', 'ghost')">幽尾玄魚</button>
          <button class="preset-btn" onclick="loadPreset('dark', 'ghost')">勾魂眼</button>
          <button class="preset-btn" onclick="loadPreset('water', 'none')">美娜斯</button>
          <button class="preset-btn" onclick="loadPreset('grass', 'fairy')">風妖精</button>
          <button class="preset-btn" onclick="loadPreset('fire', 'dark')">赤焰咆嘯虎</button>
          <button class="preset-btn" onclick="loadPreset('fire', 'fighting')">火焰雞</button>
          <button class="preset-btn" onclick="loadPreset('steel', 'ghost')">堅盾劍怪</button>
          <button class="preset-btn" onclick="loadPreset('water', 'flying')">暴鯉龍</button>
          <button class="preset-btn" onclick="loadPreset('ghost', 'grass')">來悲粗茶</button>
          <button class="preset-btn" onclick="loadPreset('dragon', 'ghost')">多龍巴魯托</button>
        </div>

        <div class="form-group">
          <label>防禦方 - 第一屬性：</label>
          <select id="def-1">
            <option value="normal">一般</option><option value="fire" selected>火</option><option value="water">水</option><option value="electric">電</option><option value="grass">草</option><option value="ice">冰</option><option value="fighting">格鬥</option><option value="poison">毒</option><option value="ground">地面</option><option value="flying">飛行</option><option value="psychic">超能力</option><option value="bug">蟲</option><option value="rock">岩石</option><option value="ghost">幽靈</option><option value="dragon">龍</option><option value="dark">惡</option><option value="steel">鋼</option><option value="fairy">妖精</option>
          </select>
        </div>
        <div class="form-group">
          <label>防禦方 - 第二屬性：</label>
          <select id="def-2">
            <option value="none">無 (單屬性)</option><option value="normal">一般</option><option value="fire">火</option><option value="water">水</option><option value="electric">電</option><option value="grass">草</option><option value="ice">冰</option><option value="fighting">格鬥</option><option value="poison">毒</option><option value="ground">地面</option><option value="flying" selected>飛行</option><option value="psychic">超能力</option><option value="bug">蟲</option><option value="rock">岩石</option><option value="ghost">幽靈</option><option value="dragon">龍</option><option value="dark">惡</option><option value="steel">鋼</option><option value="fairy">妖精</option>
          </select>
        </div>
        <button onclick="analyzeDefense()">分析防禦抗性</button>
        <div id="defense-result" class="result-section" style="display:none;"></div>
      </div>

      <!-- 分頁二：👥 隊伍盲點分析 -->
      <div id="panel-team" class="panel">
        <h3>多隻寶可夢隊伍盲點統計</h3>
        <p style="font-size: 0.85rem; color: #666; margin-bottom: 10px;">設定你的隊員組合，系統將統計全隊遭遇各屬性弱點（2倍或4倍）的累積次數：</p>
        
        <div id="team-slots-container">
          <!-- 動態產生 3 隻隊員設定 -->
          <script>
            for(let i=1; i<=3; i++) {
              document.write(`
                <div class="team-slot">
                  <span style="font-weight:bold; font-size:0.9rem; align-self:center;">隊員${i}</span>
                  <select id="team-${i}-1" style="flex:1;">
                    <option value="normal">一般</option><option value="fire">火</option><option value="water">水</option><option value="electric">電</option><option value="grass">草</option><option value="ice">冰</option><option value="fighting">格鬥</option><option value="poison">毒</option><option value="ground">地面</option><option value="flying">飛行</option><option value="psychic">超能力</option><option value="bug">蟲</option><option value="rock">岩石</option><option value="ghost">幽靈</option><option value="dragon">龍</option><option value="dark">惡</option><option value="steel">鋼</option><option value="fairy">妖精</option>
                  </select>
                  <select id="team-${i}-2" style="flex:1;">
                    <option value="none">單屬性</option><option value="normal">一般</option><option value="fire">火</option><option value="water">水</option><option value="electric">電</option><option value="grass">草</option><option value="ice">冰</option><option value="fighting">格鬥</option><option value="poison">毒</option><option value="ground">地面</option><option value="flying">飛行</option><option value="psychic">超能力</option><option value="bug">蟲</option><option value="rock">岩石</option><option value="ghost">幽靈</option><option value="dragon">龍</option><option value="dark">惡</option><option value="steel">鋼</option><option value="fairy">妖精</option>
                  </select>
                </div>
              `);
            }
          </script>
        </div>
        <button onclick="analyzeTeamWeakness()">統計全隊弱點分佈</button>
        <div id="team-result" class="result-section" style="display:none;"></div>
      </div>

      <!-- 分頁三：✨ 特性影響計算 -->
      <div id="panel-ability" class="panel">
        <h3>特性能力對防禦抗性的影響</h3>
        <p style="font-size: 0.85rem; color: #666; margin-bottom: 10px;">選擇寶可夢原本屬性，並套用對戰特殊特性來即時修正防禦結果：</p>
        
        <div class="form-group">
          <label>基本屬性：</label>
          <div style="display:flex; gap:6px;">
            <select id="ab-1">
              <option value="normal">一般</option><option value="fire">火</option><option value="water">水</option><option value="electric">電</option><option value="grass">草</option><option value="ice">冰</option><option value="fighting">格鬥</option><option value="poison">毒</option><option value="ground">地面</option><option value="flying">飛行</option><option value="psychic">超能力</option><option value="bug">蟲</option><option value="rock">岩石</option><option value="ghost" selected>幽靈</option><option value="dragon">龍</option><option value="dark">惡</option><option value="steel">鋼</option><option value="fairy">妖精</option>
            </select>
            <select id="ab-2">
              <option value="none">單屬性</option><option value="normal">一般</option><option value="fire">火</option><option value="water">水</option><option value="electric">電</option><option value="grass">草</option><option value="ice">冰</option><option value="fighting">格鬥</option><option value="poison" selected>毒</option><option value="ground">地面</option><option value="flying">飛行</option><option value="psychic">超能力</option><option value="bug">蟲</option><option value="rock">岩石</option><option value="ghost">幽靈</option><option value="dragon">龍</option><option value="dark">惡</option><option value="steel">鋼</option><option value="fairy">妖精</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label>特殊對戰特性：</label>
          <select id="ability-select">
            <option value="none">無特殊特性</option>
            <option value="levitate">✨ 漂浮 (地面屬性招式完全無效 / 0倍)</option>
            <option value="water-absorb">💧 蓄水 / 引水 (水屬性招式完全無效 / 0倍)</option>
            <option value="lightning-rod">⚡ 避雷針 / 電氣引擎 (電屬性招式完全無效 / 0倍)</option>
            <option value="flash-fire">🔥 引火 (火屬性招式完全無效 / 0倍)</option>
          </select>
        </div>

        <button onclick="analyzeAbility()">計算特性防禦抗性</button>
        <div id="ability-result" class="result-section" style="display:none;"></div>
      </div>

    </div>
  </div>

  <script>
    const allTypes = ["normal", "fire", "water", "electric", "grass", "ice", "fighting", "poison", "ground", "flying", "psychic", "bug", "rock", "ghost", "dragon", "dark", "steel", "fairy"];
    const typeNames = {
      normal: "一般", fire: "火", water: "水", electric: "電",
      grass: "草", ice: "冰", fighting: "格鬥", poison: "毒",
      ground: "地面", flying: "飛行", psychic: "超能力", bug: "蟲",
      rock: "岩石", ghost: "幽靈", dragon: "龍", dark: "惡",
      steel: "鋼", fairy: "妖精"
    };

    const chart = {
      normal: { rock: 0.5, steel: 0.5, ghost: 0 },
      fire: { grass: 2, ice: 2, bug: 2, steel: 2, fire: 0.5, water: 0.5, rock: 0.5, dragon: 0.5 },
      water: { fire: 2, ground: 2, rock: 2, water: 0.5, grass: 0.5, dragon: 0.5 },
      electric: { water: 2, flying: 2, electric: 0.5, grass: 0.5, dragon: 0.5, ground: 0 },
      grass: { water: 2, ground: 2, rock: 2, fire: 0.5, grass: 0.5, poison: 0.5, flying: 0.5, bug: 0.5, dragon: 0.5, steel: 0.5 },
      ice: { grass: 2, ground: 2, flying: 2, dragon: 2, fire: 0.5, water: 0.5, ice: 0.5, steel: 0.5 },
      fighting: { normal: 2, ice: 2, rock: 2, dark: 2, steel: 2, poison: 0.5, flying: 0.5, psychic: 0.5, bug: 0.5, fairy: 0.5, ghost: 0 },
      poison: { grass: 2, fairy: 2, poison: 0.5, ground: 0.5, rock: 0.5, ghost: 0.5, steel: 0 },
      ground: { fire: 2, electric: 2, poison: 2, rock: 2, steel: 2, grass: 0.5, bug: 0.5, flying: 0 },
      flying: { grass: 2, fighting: 2, bug: 2, electric: 0.5, rock: 0.5, steel: 0.5 },
      psychic: { fighting: 2, poison: 2, psychic: 0.5, steel: 0.5, dark: 0 },
      bug: { grass: 2, psychic: 2, dark: 2, fire: 0.5, fighting: 0.5, poison: 0.5, flying: 0.5, ghost: 0.5, steel: 0.5, fairy: 0.5 },
      rock: { fire: 2, ice: 2, flying: 2, bug: 2, fighting: 0.5, ground: 0.5, steel: 0.5 },
      ghost: { psychic: 2, ghost: 2, dark: 0.5, normal: 0 },
      dragon: { dragon: 2, steel: 0.5, fairy: 0 },
      dark: { psychic: 2, ghost: 2, fighting: 0.5, dark: 0.5, fairy: 0.5 },
      steel: { ice: 2, rock: 2, fairy: 2, fire: 0.5, water: 0.5, electric: 0.5, steel: 0.5 },
      fairy: { fighting: 2, dragon: 2, dark: 2, fire: 0.5, poison: 0.5, steel: 0.5 }
    };

    function getMultiplier(atk, def) {
      if (!chart[atk]) return 1;
      return chart[atk][def] !== undefined ? chart[atk][def] : 1;
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      if (tab === 'defense') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('panel-defense').classList.add('active');
      } else if (tab === 'team') {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('panel-team').classList.add('active');
      } else {
        document.querySelectorAll('.tab-btn')[2].classList.add('active');
        document.getElementById('panel-ability').classList.add('active');
      }
    }

    function loadPreset(t1, t2) {
      document.getElementById('def-1').value = t1;
      document.getElementById('def-2').value = t2;
      analyzeDefense();
    }

    function analyzeDefense() {
      const d1 = document.getElementById('def-1').value;
      const d2 = document.getElementById('def-2').value;
      const resDiv = document.getElementById('defense-result');
      resDiv.style.display = 'block';

      let groups = { 4: [], 2: [], 1: [], 0.5: [], 0.25: [], 0: [] };

      allTypes.forEach(atk => {
        let m1 = getMultiplier(atk, d1);
        let m2 = (d2 !== 'none') ? getMultiplier(atk, d2) : 1;
        let total = m1 * m2;
        if (groups[total]) {
          groups[total].push(atk);
        }
      });

      let html = "";
      if (groups[4].length > 0) html += `<div class="result-category"><strong>💥 4 倍傷害 (極度弱點)：</strong>` + groups[4].map(t => `<span class="type-badge bg-${t}">${typeNames[t]}</span>`).join('') + `</div>`;
      if (groups[2].length > 0) html += `<div class="result-category"><strong>⚡ 2 倍傷害 (弱點)：</strong>` + groups[2].map(t => `<span class="type-badge bg-${t}">${typeNames[t]}</span>`).join('') + `</div>`;
      if (groups[0.5].length > 0) html += `<div class="result-category"><strong>🛡️ 0.5 倍傷害 (抗性)：</strong>` + groups[0.5].map(t => `<span class="type-badge bg-${t}">${typeNames[t]}</span>`).join('') + `</div>`;
      if (groups[0.25].length > 0) html += `<div class="result-category"><strong>🧱 0.25 倍傷害 (強力抗性)：</strong>` + groups[0.25].map(t => `<span class="type-badge bg-${t}">${typeNames[t]}</span>`).join('') + `</div>`;
      if (groups[0].length > 0) html += `<div class="result-category"><strong>🚫 0 倍傷害 (完全無效)：</strong>` + groups[0].map(t => `<span class="type-badge bg-${t}">${typeNames[t]}</span>`).join('') + `</div>`;
      
      resDiv.innerHTML = html || "此組合無特殊倍率";
    }

    function analyzeTeamWeakness() {
      let weaknessCounts = {};
      allTypes.forEach(t => weaknessCounts[t] = 0);

      for(let i=1; i<=3; i++) {
        let d1 = document.getElementById(`team-${i}-1`).value;
        let d2 = document.getElementById(`team-${i}-2`).value;

        allTypes.forEach(atk => {
          let m1 = getMultiplier(atk, d1);
          let m2 = (d2 !== 'none') ? getMultiplier(atk, d2) : 1;
          let total = m1 * m2;
          if (total >= 2) { // 只要受到2倍或4倍傷害就算隊伍弱點
            weaknessCounts[atk]++;
          }
        });
      }

      const resDiv = document.getElementById('team-result');
      resDiv.style.display = 'block';

      let sortedWeaknesses = Object.keys(weaknessCounts).filter(t => weaknessCounts[t] > 0).sort((a,b) => weaknessCounts[b] - weaknessCounts[a]);

      let html = `<div class="result-category"><strong>📊 全隊弱點屬性累積次數：</strong>`;
      if(sortedWeaknesses.length === 0) {
        html += `<p>太神啦！目前隊伍沒有明顯弱點屬性。</p>`;
      } else {
        sortedWeaknesses.forEach(t => {
          html += `<div style="margin:4px 0;"><span class="type-badge bg-${t}">${typeNames[t]}</span> 共有 <strong style="color:#C0392B;">${weaknessCounts[t]}</strong> 隻隊員害怕此屬性</div>`;
        });
      }
      html += `</div>`;
      resDiv.innerHTML = html;
    }

    function analyzeAbility() {
      const d1 = document.getElementById('ab-1').value;
      const d2 = document.getElementById('ab-2').value;
      const ability = document.getElementById('ability-select').value;
      const resDiv = document.getElementById('ability-result');
      resDiv.style.display = 'block';

      let groups = { 4: [], 2: [], 1: [], 0.5: [], 0.25: [], 0: [] };

      allTypes.forEach(atk => {
        let m1 = getMultiplier(atk, d1);
        let m2 = (d2 !== 'none') ? getMultiplier(atk, d2) : 1;
        let total = m1 * m2;

        // 特性覆蓋邏輯
        if (ability === 'levitate' && atk === 'ground') total = 0;
        if (ability === 'water-absorb' && atk === 'water') total = 0;
        if (ability === 'lightning-rod' && atk === 'electric') total = 0;
        if (ability === 'flash-fire' && atk === 'fire') total = 0;

        if (groups[total]) {
          groups[total].push(atk);
        }
      });

      let html = `<div style="font-size:0.85rem; color:#D35400; margin-bottom:8px; font-weight:bold;">✨ 已套用特性修正：${document.getElementById('ability-select').selectedOptions[0].text}</div>`;
      if (groups[4].length > 0) html += `<div class="result-category"><strong>💥 4 倍傷害：</strong>` + groups[4].map(t => `<span class="type-badge bg-${t}">${typeNames[t]}</span>`).join('') + `</div>`;
      if (groups[2].length > 0) html += `<div class="result-category"><strong>⚡ 2 倍傷害：</strong>` + groups[2].map(t => `<span class="type-badge bg-${t}">${typeNames[t]}</span>`).join('') + `</div>`;
      if (groups[0.5].length > 0) html += `<div class="result-category"><strong>🛡️ 0.5 倍抗性：</strong>` + groups[0.5].map(t => `<span class="type-badge bg-${t}">${typeNames[t]}</span>`).join('') + `</div>`;
      if (groups[0.25].length > 0) html += `<div class="result-category"><strong>🧱 0.25 倍強力抗性：</strong>` + groups[0.25].map(t => `<span class="type-badge bg-${t}">${typeNames[t]}</span>`).join('') + `</div>`;
      if (groups[0].length > 0) html += `<div class="result-category"><strong>🚫 0 倍無效：</strong>` + groups[0].map(t => `<span class="type-badge bg-${t}">${typeNames[t]}</span>`).join('') + `</div>`;

      resDiv.innerHTML = html;
    }
  </script>
</body>
</html>
