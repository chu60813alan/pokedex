<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>寶可夢 18 屬性全方位對戰戰術中心</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #FFF9F2;
      color: #333;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      width: 100%;
      max-width: 680px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 1.1rem;
      color: #D35400;
      text-align: center;
      width: 100%;
    }
    .tab-nav {
      display: flex;
      gap: 2px;
      margin-bottom: 16px;
    }
    .tab-btn {
      flex: 1;
      padding: 8px 1px;
      border: 2px solid #F39C12;
      background-color: #FFF3E6;
      color: #D35400;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
      font-size: 0.72rem;
      transition: 0.2s;
    }
    .tab-btn.active {
      background-color: #E67E22;
      color: white;
    }
    .tool-box {
      background: #FFFFFF;
      border: 2px solid #F39C12;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 4px 12px rgba(230, 120, 23, 0.1);
    }
    .tool-box h3 {
      font-size: 1.05rem;
      color: #D35400;
      margin-bottom: 12px;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 4px;
      color: #555;
      font-size: 0.9rem;
    }
    select, input {
      width: 100%;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #F39C12;
      font-size: 1rem;
      background-color: #FFF;
    }
    button {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: none;
      background-color: #E67E22;
      color: white;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
      margin-top: 6px;
    }
    button:active { background-color: #D35400; }
    .panel { display: none; }
    .panel.active { display: block; }
    
    .preset-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 12px;
      max-height: 180px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .preset-btn {
      padding: 6px 4px;
      font-size: 0.8rem;
      background-color: #FFF3E6;
      border: 1px solid #F39C12;
      color: #D35400;
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
      font-weight: bold;
    }
    .preset-btn:hover { background-color: #F39C12; color: white; }

    .result-section {
      margin-top: 14px;
      padding: 14px;
      border-radius: 8px;
      background: #FFF3E6;
      font-size: 0.9rem;
      line-height: 1.5;
    }
    .result-category {
      margin-bottom: 8px;
    }
    .result-category strong {
      display: block;
      margin-bottom: 6px;
      color: #D35400;
      border-bottom: 1px dashed #F39C12;
      padding-bottom: 4px;
    }
    .type-badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: bold;
      color: white;
    }
    
    .team-slot {
      background: #FFF9F2;
      border: 1px dashed #F39C12;
      padding: 8px;
      border-radius: 8px;
      margin-bottom: 8px;
    }

    .weakness-card {
      background: #FFFFFF;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 8px;
      border: 1px solid #F39C12;
    }
    .weakness-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .pivot-info {
      font-size: 0.85rem;
      color: #27AE60;
      background: #E8F8F5;
      padding: 6px 8px;
      border-radius: 6px;
      border-left: 4px solid #2ECC71;
    }
    .pivot-none {
      font-size: 0.85rem;
      color: #C0392B;
      background: #FDEDEC;
      padding: 6px 8px;
      border-radius: 6px;
      border-left: 4px solid #E74C3C;
    }

    .dex-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 14px;
      max-height: 160px;
      overflow-y: auto;
    }
    .dex-btn {
      padding: 6px 4px;
      font-size: 0.8rem;
      background-color: #FFF3E6;
      border: 1px solid #F39C12;
      color: #D35400;
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
      font-weight: bold;
    }
    .dex-btn:hover { background-color: #F39C12; color: white; }
    
    /* 方案 A：更詳細的招式卡片與特效說明樣式 */
    .move-card {
      background: #FFFFFF;
      border: 1px solid #F39C12;
      padding: 8px 10px;
      border-radius: 6px;
      margin-bottom: 6px;
      font-size: 0.85rem;
    }
    .move-name {
      font-weight: bold;
      color: #D35400;
      font-size: 0.9rem;
    }
    .move-desc {
      color: #555;
      margin-top: 2px;
      font-size: 0.8rem;
    }

    .calc-box {
      background: #FFFFFF;
      border: 1px solid #F39C12;
      padding: 12px;
      border-radius: 8px;
      margin-top: 10px;
    }

    /* 屬性色彩標章 */
    .bg-normal { background-color: #A8A878; }
    .bg-fire { background-color: #F08030; }
    .bg-water { background-color: #6890F0; }
    .bg-electric { background-color: #F8D030; color: #333; }
    .bg-grass { background-color: #78C850; }
    .bg-ice { background-color: #98D8D8; color: #333; }
    .bg-fighting { background-color: #C03028; }
    .bg-poison { background-color: #A040A0; }
    .bg-ground { background-color: #E0C068; color: #333; }
    .bg-flying { background-color: #A890F0; }
    .bg-psychic { background-color: #F85888; }
    .bg-bug { background-color: #A8B820; }
    .bg-rock { background-color: #B8A038; }
    .bg-ghost { background-color: #705898; }
    .bg-dragon { background-color: #7038F8; }
    .bg-dark { background-color: #705848; }
    .bg-steel { background-color: #B8B8D0; color: #333; }
    .bg-fairy { background-color: #EE99AC; color: #333; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">

    </div>

    <!-- 五大功能分頁切換 -->

      <div class="tab-btn" onclick="switchTab('team')">👥 隊伍聯防</div>
      <div class="tab-btn" onclick="switchTab('ability')">✨ 特性影響</div>

    <div class="tool-box">

        <div class="form-group">

          </select>
        </div>
        <button onclick="analyzeDefense()">分析防禦抗性</button>
        <div id="defense-result" class="result-section" style="display:none;"></div>
      </div>

      <!-- 分頁二：隊伍聯防 -->
      <div id="panel-team" class="panel">
        <h3>多隻寶可夢隊伍盲點與聯防分析</h3>
        <p style="font-size: 0.85rem; color: #666; margin-bottom: 10px;">設定你的 3 隻隊員（可直接從 40 隻熱門寶可夢中選擇，或自訂屬性）：</p>
        
        <div id="team-slots-container">
          <script>
            for(let i=1; i<=3; i++) {
              document.write(`
                <div class="team-slot">
                  <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
                    <span style="font-weight:bold; font-size:0.9rem;">隊員 ${i}</span>
                    <select id="team-preset-${i}" onchange="applyTeamPreset(${i})" style="width: 160px; font-size:0.8rem; padding:2px;">
                      <option value="">-- 選擇 40 隻熱門角色 --</option>
                    </select>
                  </div>
                  <div style="display:flex; gap:6px;">
                    <select id="team-${i}-1" style="flex:1;">
                      <option value="normal">一般</option><option value="fire">火</option><option value="water">水</option><option value="electric">電</option><option value="grass">草</option><option value="ice">冰</option><option value="fighting">格鬥</option><option value="poison">毒</option><option value="ground">地面</option><option value="flying">飛行</option><option value="psychic">超能力</option><option value="bug">蟲</option><option value="rock">岩石</option><option value="ghost">幽靈</option><option value="dragon">龍</option><option value="dark">惡</option><option value="steel">鋼</option><option value="fairy">妖精</option>
                    </select>
                    <select id="team-${i}-2" style="flex:1;">
                      <option value="none">單屬性</option><option value="normal">一般</option><option value="fire">火</option><option value="water">水</option><option value="electric">電</option><option value="grass">草</option><option value="ice">冰</option><option value="fighting">格鬥</option><option value="poison">毒</option><option value="ground">地面</option><option value="flying">飛行</option><option value="psychic">超能力</option><option value="bug">蟲</option><option value="rock">岩石</option><option value="ghost">幽靈</option><option value="dragon">龍</option><option value="dark">惡</option><option value="steel">鋼</option><option value="fairy">妖精</option>
                    </select>
                  </div>
                </div>
              `);
            }
          </script>
        </div>
        <button onclick="analyzeTeamWeakness()">分析全隊盲點與聯防</button>
        <div id="team-result" class="result-section" style="display:none;"></div>
      </div>

      <!-- 分頁三：特性影響 -->
      <div id="panel-ability" class="panel">
        <h3>特性能力對防禦抗性的影響</h3>
        <p style="font-size: 0.85rem; color: #666; margin-bottom: 10px;">選擇寶可夢原本屬性，並套用對戰特殊特性來即時修正防禦結果：</p>
        
        <div class="form-group">
          <label>基本屬性：</label>
          <div style="display:flex; gap:6px;">
            <select id="ab-1">
              <option value="normal">一般</option><option value="fire">火</option><option value="water">水</option><option value="electric">電</option><option value="grass">草</option><option value="ice">冰</option><option value="fighting">格鬥</option><option value="poison">毒</option><option value="ground">地面</option><option value="flying">飛行</option><option value="psychic">超能力</option><option value="bug">蟲</option><option value="rock">岩石</option><option value="ghost" selected>幽靈</option><option value="dragon">龍</option><option value="dark">惡</option><option value="steel">鋼</option><option value="fairy">妖精</option>
            </select>
            <select id="ab-2">
              <option value="none">單屬性</option><option value="normal">一般</option><option value="fire">火</option><option value="water">水</option><option value="electric">電</option><option value="grass">草</option><option value="ice">冰</option><option value="fighting">格鬥</option><option value="poison" selected>毒</option><option value="ground">地面</option><option value="flying">飛行</option><option value="psychic">超能力</option><option value="bug">蟲</option><option value="rock">岩石</option><option value="ghost">幽靈</option><option value="dragon">龍</option><option value="dark">惡</option><option value="steel">鋼</option><option value="fairy">妖精</option>

            <option value="flash-fire">🔥 引火 (火屬性招式完全無效 / 0倍)</option>
          </select>
        </div>

        <button onclick="analyzeAbility()">計算特性防禦抗性</button>
        <div id="ability-result" class="result-section" style="display:none;"></div>
      </div>

      <!-- 分頁四：📖 40 隻寶可夢情報與招式庫 (方案 A：帶詳細威力和副作用說明) -->
      <div id="panel-dex" class="panel">
        <h3>寶可夢專屬特性與招式情報庫 (含特效說明)</h3>
        <p style="font-size: 0.85rem; color: #666; margin-bottom: 10px;">點擊下方角色，查看其特性、高威力招式（含蓄力/副作用說明）、先制與強化技：</p>
        
        <div class="dex-grid" id="dex-container"></div>
        <div id="dex-result" class="result-section" style="display:none;">請點選上方寶可夢查看詳細情報</div>
      </div>

      <!-- 分頁五：📊 傷害與戰術計算機 (方案 B) -->
      <div id="panel-calc" class="panel">
        <h3>簡易戰術傷害與血量估算機</h3>
        <p style="font-size: 0.85rem; color: #666; margin-bottom: 10px;">輸入招式威力、攻擊方能力階級與雙方屬性，快速估算打落對手的確切傷害與比例：</p>
        
        <div class="form-group">
          <label>攻擊方招式威力 (Power)：</label>
          <input type="number" id="calc-power" value="110" min="10" max="250">
        </div>

        <div class="form-group">
          <label>攻擊方能力階級 (Stage)：</label>

        <div class="form-group">
          <label>防禦方第一屬性：</label>
          <select id="calc-def-1">
            <option value="normal">一般</option><option value="fire">火</option><option value="water">水</option><option value="electric">電</option><option value="grass">草</option><option value="ice">冰</option><option value="fighting">格鬥</option><option value="poison">毒</option><option value="ground">地面</option><option value="flying">飛行</option><option value="psychic">超能力</option><option value="bug">蟲</option><option value="rock">岩石</option><option value="ghost">幽靈</option><option value="dragon" selected>龍</option><option value="dark">惡</option><option value="steel">鋼</option><option value="fairy">妖精</option>
          </select>
        </div>

        <div class="form-group">
          <label>防禦方第二屬性：</label>
          <select id="calc-def-2">
            <option value="none" selected>無 (單屬性)</option><option value="normal">一般</option><option value="fire">火</option><option value="water">水</option><option value="electric">電</option><option value="grass">草</option><option value="ice">冰</option><option value="fighting">格鬥</option><option value="poison">毒</option><option value="ground">地面</option><option value="flying">飛行</option><option value="psychic">超能力</option><option value="bug">蟲</option><option value="rock">岩石</option><option value="ghost">幽靈</option><option value="dragon">龍</option><option value="dark">惡</option><option value="steel">鋼</option><option value="fairy">妖精</option>
          </select>
        </div>

        <button onclick="calculateDamage()">計算確切傷害與血量比例</button>
        <div id="calc-result" class="result-section" style="display:none;"></div>
      </div>

    </div>
  </div>

  <script>
    const allTypes = ["normal", "fire", "water", "electric", "grass", "ice", "fighting", "poison", "ground", "flying", "psychic", "bug", "rock", "ghost", "dragon", "dark", "steel", "fairy"];

    const pokemons = [
      {

        ],

    window.onload = function() {
      const grid = document.getElementById('preset-container');
      pokemons.forEach(p => {
        let btn = document.createElement('button');
        btn.className = 'preset-btn';
        btn.innerText = p.name;
        btn.onclick = () => loadPreset(p.t1, p.t2);
        grid.appendChild(btn);
      });

      for(let i=1; i<=3; i++) {
        let sel = document.getElementById(`team-preset-${i}`);
        pokemons.forEach((p, idx) => {
          let opt = document.createElement('option');
          opt.value = idx;
          opt.innerText = p.name;
          sel.appendChild(opt);
        });
      }

      const dexGrid = document.getElementById('dex-container');
      pokemons.forEach((p, idx) => {
        let btn = document.createElement('button');
        btn.className = 'dex-btn';
        btn.innerText = p.name;
        btn.onclick = () => showPokemonDex(idx);
        dexGrid.appendChild(btn);
      });
    };

    function getMultiplier(atk, def1, def2) {
      let m1 = (chart[atk] && chart[atk][def1] !== undefined) ? chart[atk][def1] : 1;
      let m2 = (def2 !== 'none' && chart[atk] && chart[atk][def2] !== undefined) ? chart[atk][def2] : 1;
      return m1 * m2;
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      if (tab === 'defense') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('panel-defense').classList.add('active');
      } else if (tab === 'team') {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('panel-team').classList.add('active');
      } else if (tab === 'ability') {
        document.querySelectorAll('.tab-btn')[2].classList.add('active');
        document.getElementById('panel-ability').classList.add('active');
      } else if (tab === 'dex') {
        document.querySelectorAll('.tab-btn')[3].classList.add('active');
        document.getElementById('panel-dex').classList.add('active');
      } else {
        document.querySelectorAll('.tab-btn')[4].classList.add('active');
        document.getElementById('panel-calc').classList.add('active');
      }
    }

    function loadPreset(t1, t2) {
      document.getElementById('def-1').value = t1;
      document.getElementById('def-2').value = t2;
      analyzeDefense();
    }

    function applyTeamPreset(i) {
      let idx = document.getElementById(`team-preset-${i}`).value;
      if(idx === "") return;
      let p = pokemons[idx];
      document.getElementById(`team-${i}-1`).value = p.t1;
      document.getElementById(`team-${i}-2`).value = p.t2;
    }

    /* 方案 A 渲染邏輯：顯示每個招式的詳細威力與副作用 */
    function showPokemonDex(idx) {
      let p = pokemons[idx];
      let resDiv = document.getElementById('dex-result');
      resDiv.style.display = 'block';

      let typeText = `<span class="type-badge bg-${p.t1}">${typeNames[p.t1]}</span>`;
      if(p.t2 !== 'none') {
        typeText += ` <span class="type-badge bg-${p.t2}">${typeNames[p.t2]}</span>`;
      }

      let powerHtml = p.powerMoves.length > 0 ? p.powerMoves.map(m => `
        <div class="move-card">
          <div class="move-name">💥 ${m.name}</div>
          <div class="move-desc">${m.desc}</div>
        </div>
      `).join('') : '<span style="color:#888;">無</span>';

      let prioHtml = p.priorityMoves.length > 0 ? p.priorityMoves.map(m => `
        <div class="move-card" style="border-color:#E74C3C;">
          <div class="move-name" style="color:#C0392B;">⚡ ${m.name}</div>
          <div class="move-desc">${m.desc}</div>
        </div>
      `).join('') : '<span style="color:#888;">無</span>';

      let setupHtml = p.setupMoves.length > 0 ? p.setupMoves.map(m => `
        <div class="move-card" style="border-color:#2980B9;">
          <div class="move-name" style="color:#2980B9;">📈 ${m.name}</div>
          <div class="move-desc">${m.desc}</div>
        </div>
      `).join('') : '<span style="color:#888;">無</span>';

      let html = `
        <div class="result-category">
          <strong>📌 寶可夢名稱：${p.name}</strong>
          <div style="margin-top:4px;">屬性：${typeText}</div>
        </div>
        <div class="result-category">
          <strong>🌟 特性：</strong>
          <span style="color:#D35400; font-weight:bold;">${p.abilities}</span>
        </div>
        <div class="result-category">
          <strong>💥 核心輸出招式與詳細特效：</strong>
          ${powerHtml}
        </div>
        <div class="result-category">
          <strong>⚡ 先制招式：</strong>
          ${prioHtml}
        </div>
        <div class="result-category">
          <strong>📈 強力強化與變化招式：</strong>
          ${setupHtml}
        </div>
      `;
      resDiv.innerHTML = html;
    }

    /* 方案 B 計算核心 */
    function calculateDamage() {
      let power = parseFloat(document.getElementById('calc-power').value) || 90;
      let stageMultiplier = parseFloat(document.getElementById('calc-stage').value) || 1;
      let def1 = document.getElementById('calc-def-1').value;
      let def2 = document.getElementById('calc-def-2').value;

      let resDiv = document.getElementById('calc-result');
      resDiv.style.display = 'block';

      let html = `<div class="result-category"><strong>📊 針對該防禦組合 (${typeNames[def1]}${def2 !== 'none' ? '/' + typeNames[def2] : ''}) 的傷害模擬：</strong></div>`;
      
      let damageRows = [];
      allTypes.forEach(atk => {
        let mult = getMultiplier(atk, def1, def2);
        if (mult > 0) {
          let estimatedDmg = Math.floor((power * stageMultiplier * mult * 0.75));
          damageRows.push({ atk: atk, mult: mult, dmg: estimatedDmg });
        } else {
          damageRows.push({ atk: atk, mult: 0, dmg: 0 });
        }
      });

      damageRows.sort((a, b) => b.dmg - a.dmg);
      let top3 = damageRows.slice(0, 3);
      
      html += `<div style="font-size:0.85rem; color:#555; margin-bottom:6px;">使用威力 <strong>${power}</strong> (強化倍率 <strong>${stageMultiplier}x</strong>) 打擊時的預估效果：</div>`;
      
      top3.forEach(item => {
        let percent = Math.min(100, Math.floor((item.dmg / 150) * 100));
        html += `
          <div class="calc-box">
            <span class="type-badge bg-${item.atk}">${typeNames[item.atk]}屬性招式</span> 
            <span style="font-size:0.85rem; margin-left:6px;">相剋倍率：<strong>${item.mult}x</strong></span>
            <div style="margin-top:4px; font-size:0.9rem; color:#D35400;">
              預估傷害值：約 <strong>${item.dmg}</strong> 傷害 (約佔標準 150 血量之 <strong>${percent}%</strong>)
            </div>
          </div>
        `;
      });

      resDiv.innerHTML = html;
    }

    function analyzeDefense() {
      const d1 = document.getElementById('def-1').value;
      const d2 = document.getElementById('def-2').value;
      const resDiv = document.getElementById('defense-result');
      resDiv.style.display = 'block';

      let groups = { 4: [], 2: [], 1: [], 0.5: [], 0.25: [], 0: [] };

      allTypes.forEach(atk => {
        let total = getMultiplier(atk, d1, d2);
        if (groups[total]) {
          groups[total].push(atk);
        }
      });

      let html = "";
      if (groups[4].length > 0) html += `<div class="result-category"><strong>💥 4 倍傷害 (極度弱點)：</strong>` + groups[4].map(t => `<span class="type-badge bg-${t}">${typeNames[t]}</span>`).join('') + `</div>`;
      if (groups[2].length > 0) html += `<div class="result-category"><strong>⚡ 2 倍傷害 (弱點)：</strong>` + groups[2].map(t => `<span class="type-badge bg-${t}">${typeNames[t]}</span>`).join('') + `</div>`;
      if (groups[0.5].length > 0) html += `<div class="result-category"><strong>🛡️ 0.5 倍傷害 (抗性)：</strong>` + groups[0.5].map(t => `<span class="type-badge bg-${t}">${typeNames[t]}</span>`).join('') + `</div>`;
      if (groups[0.25].length > 0) html += `<div class="result-category"><strong>🧱 0.25 倍傷害 (強力抗性)：</strong>` + groups[0.25].map(t => `<span class="type-badge bg-${t}">${typeNames[t]}</span>`).join('') + `</div>`;
      if (groups[0].length > 0) html += `<div class="result-category"><strong>🚫 0 倍傷害 (完全無效)：</strong>` + groups[0].map(t => `<span class="type-badge bg-${t}">${typeNames[t]}</span>`).join('') + `</div>`;
      
      resDiv.innerHTML = html || "此組合無特殊倍率";
    }

    function analyzeTeamWeakness() {
      let team = [];
      for(let i=1; i<=3; i++) {
        let t1 = document.getElementById(`team-${i}-1`).value;
        let t2 = document.getElementById(`team-${i}-2`).value;
        team.push({ id: i, t1: t1, t2: t2 });
      }

      const resDiv = document.getElementById('team-result');
      resDiv.style.display = 'block';

      let html = `<div class="result-category"><strong>📊 全隊屬性弱點與聯防分析：</strong></div>`;
      let hasWeakness = false;

      allTypes.forEach(atk => {
        let weakMembers = [];
        let pivotMembers = [];

        team.forEach(member => {
          let mult = getMultiplier(atk, member.t1, member.t2);
          if (mult >= 2) {
            weakMembers.push(`隊員${member.id}`);
          } else if (mult < 1) {
            pivotMembers.push(`隊員${member.id}`);
          }
        });

        if (weakMembers.length > 0) {
          hasWeakness = true;
          let pivotText = "";
          if (pivotMembers.length > 0) {
            pivotText = `<div class="pivot-info">💡 可聯防幫扛：${pivotMembers.join(', ')} 具有抗性或免疫！</div>`;
          } else {
            pivotText = `<div class="pivot-none">⚠️ 注意：全隊無人可抗此屬性，屬性盲點！</div>`;
          }

          html += `
            <div class="weakness-card">
              <div class="weakness-header">
                <span class="type-badge bg-${atk}">${typeNames[atk]}</span>
                <span style="font-size: 0.85rem; color: #555;">${weakMembers.join(', ')} 害怕此屬性</span>
              </div>
              ${pivotText}
            </div>
          `;
        }
      });

      if(!hasWeakness) {
        html += `<p style="padding: 8px;">太神啦！目前隊伍互相補足，沒有任何成員害怕的屬性會變成全隊死角。</p>`;
      }

      resDiv.innerHTML = html;
    }

    function analyzeAbility() {
      const d1 = document.getElementById('ab-1').value;
      const d2 = document.getElementById('ab-2').value;
      const ability = document.getElementById('ability-select').value;
      const resDiv = document.getElementById('ability-result');
      resDiv.style.display = 'block';

      let groups = { 4: [], 2: [], 1: [], 0.5: [], 0.25: [], 0: [] };

      allTypes.forEach(atk => {
        let total = getMultiplier(atk, d1, d2);

        if (ability === 'levitate' && atk === 'ground') total = 0;
        if (ability === 'water-absorb' && atk === 'water') total = 0;
        if (ability === 'lightning-rod' && atk === 'electric') total = 0;
        if (ability === 'flash-fire' && atk === 'fire') total = 0;

        if (groups[total]) {
          groups[total].push(atk);
        }
      });

      let html = `<div style="font-size:0.85rem; color:#D35400; margin-bottom:8px; font-weight:bold;">✨ 已套用特性修正：${document.getElementById('ability-select').selectedOptions[0].text}</div>`;
      if (groups[4].length > 0) html += `<div class="result-category"><strong>💥 4 倍傷害：</strong>` + groups[4].map(t => `<span class="type-badge bg-${t}">${typeNames[t]}</span>`).join('') + `</div>`;
      if (groups[2].length > 0) html += `<div class="result-category"><strong>⚡ 2 倍傷害：</strong>` + groups[2].map(t => `<span class="type-badge bg-${t}">${typeNames[t]}</span>`).join('') + `</div>`;
      if (groups[0.5].length > 0) html += `<div class="result-category"><strong>🛡️ 0.5 倍抗性：</strong>` + groups[0.5].map(t => `<span class="type-badge bg-${t}">${typeNames[t]}</span>`).join('') + `</div>`;
      if (groups[0.25].length > 0) html += `<div class="result-category"><strong>🧱 0.25 倍強力抗性：</strong>` + groups[0.25].map(t => `<span class="type-badge bg-${t}">${typeNames[t]}</span>`).join('') + `</div>`;
      if (groups[0].length > 0) html += `<div class="result-category"><strong>🚫 0 倍無效：</strong>` + groups[0].map(t => `<span class="type-badge bg-${t}">${typeNames[t]}</span>`).join('') + `</div>`;

      resDiv.innerHTML = html;
    }
  </script>
